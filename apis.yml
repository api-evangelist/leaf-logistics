aid: leaf-logistics
name: Leaf Logistics
description: >-
  Leaf Logistics Inc. is a New York-based freight coordination platform that lets shippers, carriers
  and brokers plan, schedule and move truckload freight months in advance instead of one load at a
  time. Leaf builds multi-shipper circuits and "Flex Fleets" — multi-shipper dedicated capacity — so
  participants get long-term contracted rates, guaranteed tender acceptance and fewer empty miles,
  which Leaf positions as both a cost and a Scope 3 emissions reduction. The platform is delivered as
  a hosted web application at app.leaflogistics.com backed by a Hasura GraphQL Engine API at
  api.leaflogistics.com. Leaf tells prospective shippers it will integrate with their existing TMS
  and carrier network "through email, phone, fax, EDI, API — whatever you prefer", but as of this
  profile it publishes no public developer portal, no API reference and no machine-readable contract:
  the GraphQL endpoint answers anonymously only with a JWT authentication error, so the schema is
  reachable only by onboarded customers.
