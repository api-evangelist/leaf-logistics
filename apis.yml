apis:
- name: Leaf Logistics Platform API
  description: >-
    The API behind the Leaf Logistics platform. api.leaflogistics.com runs Hasura GraphQL Engine
    v2.35.1 (community edition, pro-lite console) and exposes a GraphQL endpoint at /v1/graphql plus
    a Hasura REST-endpoint namespace at /api/rest. Both are in JWT authentication mode: an
    unauthenticated request returns
    {"code":"invalid-headers","message":"Missing 'Authorization' or 'Cookie' header in JWT
    authentication mode"}, so introspection is gated and no SDL, OpenAPI or published reference could
    be retrieved. Access is arranged through Leaf's onboarding/sales motion rather than a
    self-service developer portal.
  humanURL: https://www.leaflogistics.com/get-started/
