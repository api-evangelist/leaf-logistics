method: probed
source: live probes of api.leaflogistics.com + https://www.leaflogistics.com/
note: >-
  Assertions are limited to what an anonymous caller can verify. Leaf publishes no compliance page,
  no trust center and no standards claims in its documentation, so most entries are recorded as
  unknown rather than false.
standards:
- id: graphql
  conforms: true
  evidence: >-
    POST https://api.leaflogistics.com/v1/graphql returns a spec-shaped GraphQL error document
    ({"errors":[{"message":...,"extensions":{...}}]}); the host is Hasura GraphQL Engine v2.35.1 per
    /v1/version.
- id: jwt-rfc7519
  conforms: true
  evidence: >-
    The endpoint self-identifies as running in "JWT authentication mode" and names the Authorization
    header in its anonymous error body.
- id: oauth2
  conforms: unknown
  evidence: >-
    No /.well-known/oauth-authorization-server (404 on api host, 403 on www) and no published auth
    docs; the JWT issuer could not be identified.
- id: oidc
  conforms: unknown
  evidence: /.well-known/openid-configuration returned 404 (api) / 403 (www).
- id: openapi
  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc,
    /rapidoc, /swagger/v1/swagger.json and /q/openapi all returned the Hasura JSON 404 envelope on
    api.leaflogistics.com; no spec is published on any Leaf host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors are a Hasura vendor envelope ({"error","path","code"}), not application/problem+json.
- id: rfc9116-security-txt
  conforms: false
  evidence: No /.well-known/security.txt on any host (403 www, 404 api, SPA shell on app).
- id: rfc8594-sunset-header
  conforms: unknown
  evidence: No deprecation policy published; no Sunset or Deprecation header observed.
- id: asyncapi
  conforms: false
  evidence: >-
    /asyncapi.yaml and /asyncapi.json return the Hasura JSON 404 envelope; no event, streaming or
    webhook surface is documented anywhere public.
- id: soap-wsdl
  conforms: false
  evidence: >-
    ?wsdl and ?singleWsdl on every host return an HTML shell (the Hasura console, the WordPress
    export, or the app SPA), and /soap?wsdl returns the Hasura JSON 404. No SOAP contract is served,
    despite freight being a sector where SOAP/EDI enterprise surfaces are common.
domain_standards:
- id: edi-x12
  conforms: unknown
  claimed: true
  evidence: >-
    CLAIMED IN MARKETING PROSE ONLY, NOT IN A CONTRACT. The shipper FAQ at
    https://www.leaflogistics.com/shippers/ states Leaf will work "through email, phone, fax, EDI,
    API — whatever you prefer". No transaction set (204/210/214/990/997) is named anywhere public and
